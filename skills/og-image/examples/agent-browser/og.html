<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'IBM Plex Sans';src:url('../../fonts/IBMPlexSans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'IBM Plex Sans';src:url('../../fonts/IBMPlexSans-SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:block}
@font-face{font-family:'IBM Plex Sans';src:url('../../fonts/IBMPlexSans-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:'IBM Plex Mono';src:url('../../fonts/IBMPlexMono-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0b0b0f;color:#f5f5f7;font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;position:relative;-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;background-image:linear-gradient(#16161d 1px,transparent 1px),linear-gradient(90deg,#16161d 1px,transparent 1px);background-size:40px 40px;opacity:.9}
.glow{position:absolute;right:-180px;top:-180px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,#50e3c255,transparent 65%)}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.repo{font-family:'IBM Plex Mono','DejaVu Sans Mono',monospace;font-size:26px;color:#9a9aa5}
.repo b{color:#f5f5f7;font-weight:600}
h1{font-size:74px;line-height:1.04;font-weight:700;letter-spacing:-0.03em;margin-top:34px;max-width:1000px;text-wrap:balance}
h1 span{color:#50e3c2}
p{font-size:28px;line-height:1.35;color:#9a9aa5;margin-top:22px;max-width:960px}
.bottom{margin-top:auto;display:flex;align-items:center;gap:14px}
.chip{font-family:'IBM Plex Mono',monospace;font-size:20px;padding:8px 16px;border:2px solid #9a9aa555;border-radius:999px;color:#f5f5f7}
.cmd{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:22px;background:#16161d;border:2px solid #50e3c2;border-radius:10px;padding:10px 18px;color:#f5f5f7;max-width:462px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd i{color:#50e3c2;font-style:normal}
</style></head><body><div class="grid"></div><div class="glow"></div><div class="wrap">
<div class="repo">github.com/<b>vercel-labs/agent-browser</b></div>
<h1>A browser your agent drives from the shell<span>.</span></h1>
<p>Snapshot the page as an accessibility tree, act on refs like @e1, check, repeat. Native Rust CLI.</p>
<div class="bottom"><div class="chip">★ 49k</div><div class="chip">Rust</div><div class="chip">Apache-2.0</div><div class="chip">v0.42.0</div>
<div class="cmd"><i>$</i> npm install -g agent-browser</div></div>
</div></body></html>
